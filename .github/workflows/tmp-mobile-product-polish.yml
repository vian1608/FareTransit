name: Temporary mobile product polish

on:
  push:
    branches:
      - fix/mobile-product-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-product-polish
          fetch-depth: 0

      - name: Apply focused mobile polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Make the overlapped Flights search card corners unmistakably rounded on mobile.
          product_css = Path('frontend/src/shared/components/ProductSearchCard.css')
          product_text = product_css.read_text()
          flight_marker = '/* Mobile polish: visible rounded flight search-card corners. */'
          if flight_marker not in product_text:
              product_text += '''\n\n/* Mobile polish: visible rounded flight search-card corners. */\n@media (max-width: 760px) {\n  .flights-page #inquiry .inquiry-main-panel > .flights-inquiry-card {\n    border-radius: 22px 22px 16px 16px !important;\n    border-top-left-radius: 22px !important;\n    border-top-right-radius: 22px !important;\n    background-clip: padding-box !important;\n    box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.08), 0 18px 40px rgba(15, 23, 42, 0.10) !important;\n  }\n}\n'''
              product_css.write_text(product_text)

          # 2) Match the Hotel hero to Flights with four real carousel slides/dots.
          hotel_page = Path('frontend/src/features/hotels/pages/HotelSearchPage.js')
          hotel_text = hotel_page.read_text()
          pattern = re.compile(r"const hotelHeroSlides = \[\n.*?\n\];", re.S)
          matches = pattern.findall(hotel_text)
          if len(matches) != 1:
              raise SystemExit(f'hotelHeroSlides: expected exactly 1 block, found {len(matches)}')
          hotel_block = '''const hotelHeroSlides = [\n  {\n    id: 'hotel-search-1',\n    eyebrow: 'FareTransit — Hotel Search & Booking Assistance',\n    title: 'Search Hotels. Keep Every Request Trackable.',\n    lead: 'Compare live hotel options and send your selected stay directly into our travel team workflow.',\n    image: 'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1800&q=80'\n  },\n  {\n    id: 'hotel-search-2',\n    eyebrow: 'Hotels, Resorts & Vacation Stays',\n    title: 'Find the Right Stay for Your Trip',\n    lead: 'Search by destination, dates and guests, then request the property you want without losing the booking trail.',\n    image: 'https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1800&q=80'\n  },\n  {\n    id: 'hotel-search-3',\n    eyebrow: 'City Hotels & Business Stays',\n    title: 'Stay Close to What Matters',\n    lead: 'Compare well-located properties, guest ratings and practical amenities for the way you plan to travel.',\n    image: 'https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?auto=format&fit=crop&w=1800&q=80'\n  },\n  {\n    id: 'hotel-search-4',\n    eyebrow: 'Resorts, Escapes & Longer Stays',\n    title: 'Plan a Stay That Fits the Whole Trip',\n    lead: 'Review resort and extended-stay options with clear dates, guest details and a trackable reservation request.',\n    image: 'https://images.unsplash.com/photo-1571003123894-1f0594d2b5d9?auto=format&fit=crop&w=1800&q=80'\n  }\n];'''
          hotel_page.write_text(pattern.sub(hotel_block, hotel_text, count=1))

          # 3) Bring the custom Car Rentals hero into the same mobile rhythm as Flights/Hotels.
          car_css = Path('frontend/src/features/cars/pages/CarRentalsHomePage.css')
          car_text = car_css.read_text()
          car_marker = '/* Mobile polish: align the custom car hero with the shared travel hero rhythm. */'
          if car_marker not in car_text:
              car_text += '''\n\n/* Mobile polish: align the custom car hero with the shared travel hero rhythm. */\n@media (max-width: 700px) {\n  .car-rentals-home-page {\n    padding-bottom: 0;\n  }\n\n  .car-ppc-hero {\n    height: 380px;\n    min-height: 380px;\n    max-height: 380px;\n    align-items: stretch;\n  }\n\n  .car-ppc-hero__content {\n    width: 100%;\n    max-width: none;\n    margin: 0 auto;\n    padding: 0.55rem 1rem 0.9rem !important;\n    box-sizing: border-box;\n    display: flex;\n    flex-direction: column;\n    justify-content: flex-start;\n  }\n\n  .car-ppc-hero__content > .mobile-service-switcher {\n    flex: 0 0 auto;\n    margin-bottom: 0.65rem;\n  }\n\n  .car-ppc-hero .car-ppc-eyebrow {\n    margin: auto 0 0.2rem;\n    font-size: 0.66rem;\n    line-height: 1.25;\n    letter-spacing: 0.1em;\n  }\n\n  .car-ppc-hero h1 {\n    max-width: 100%;\n    font-size: clamp(1.35rem, 6vw, 1.6rem);\n    line-height: 1.14;\n    letter-spacing: -0.02em;\n  }\n\n  .car-ppc-hero__content > p {\n    max-width: none;\n    margin: 0.35rem 0 0;\n    font-size: 0.82rem;\n    line-height: 1.35;\n  }\n\n  .car-ppc-hero__actions {\n    flex-direction: row;\n    gap: 0.5rem;\n    margin-top: 0.65rem;\n  }\n\n  .car-ppc-hero__actions .car-ppc-button {\n    width: auto;\n    flex: 1 1 0;\n    min-height: 44px;\n    padding: 0.62rem 0.7rem;\n    font-size: 0.78rem;\n  }\n\n  .car-ppc-hero__actions .car-ppc-button--secondary {\n    flex: 0 0 36%;\n  }\n\n  .car-ppc-hero__notes {\n    flex-direction: row;\n    flex-wrap: wrap;\n    gap: 0.35rem 0.65rem;\n    margin-top: 0.55rem;\n    font-size: 0.68rem;\n    line-height: 1.2;\n  }\n}\n\n@media (max-width: 380px) {\n  .car-ppc-hero__content {\n    padding-left: 0.75rem !important;\n    padding-right: 0.75rem !important;\n  }\n\n  .car-ppc-hero h1 {\n    font-size: 1.3rem;\n  }\n\n  .car-ppc-hero__content > p {\n    font-size: 0.78rem;\n  }\n\n  .car-ppc-hero__actions .car-ppc-button {\n    font-size: 0.72rem;\n    padding-left: 0.5rem;\n    padding-right: 0.5rem;\n  }\n}\n'''
              car_css.write_text(car_text)

          # 4) Extend the existing build-time regression guard for these exact mobile fixes.
          verifier = Path('frontend/scripts/verify-responsive-travel-redundancy.js')
          verify_text = verifier.read_text()
          old_reads = "const carPage = read('frontend/src/features/cars/pages/CarRentalsHomePage.js');\nconst guardrails = read('frontend/src/shared/styles/ResponsiveTravelRedundancy.css');"
          new_reads = "const carPage = read('frontend/src/features/cars/pages/CarRentalsHomePage.js');\nconst carCss = read('frontend/src/features/cars/pages/CarRentalsHomePage.css');\nconst hotelPage = read('frontend/src/features/hotels/pages/HotelSearchPage.js');\nconst guardrails = read('frontend/src/shared/styles/ResponsiveTravelRedundancy.css');"
          if 'const carCss = read(' not in verify_text:
              if old_reads not in verify_text:
                  raise SystemExit('verifier read insertion point not found')
              verify_text = verify_text.replace(old_reads, new_reads, 1)

          old_check = "if (!carPage.includes(\"import MobileServiceSwitcher\") || !carPage.includes('<MobileServiceSwitcher active=\"cars\" />')) {\n  fail('Car Rentals is missing the shared mobile-only travel service switcher.');\n}\n"
          new_check = old_check + "if ((hotelPage.match(/id: 'hotel-search-/g) || []).length !== 4) {\n  fail('Hotel hero must expose four slides to match the Flights carousel.');\n}\nif (!productCss.includes('border-top-left-radius: 22px !important') || !productCss.includes('border-top-right-radius: 22px !important')) {\n  fail('Flights mobile search card is missing explicit rounded top corners.');\n}\nif (!carCss.includes('height: 380px;') || !carCss.includes('margin: auto 0 0.2rem;') || !carCss.includes('flex: 0 0 36%;')) {\n  fail('Car Rentals mobile hero is missing the compact shared-layout alignment rules.');\n}\n"
          if "Hotel hero must expose four slides" not in verify_text:
              if old_check not in verify_text:
                  raise SystemExit('verifier check insertion point not found')
              verify_text = verify_text.replace(old_check, new_check, 1)
          verifier.write_text(verify_text)

          Path('.github/workflows/tmp-mobile-product-polish.yml').unlink()
          PY

      - name: Commit polished mobile layouts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/shared/components/ProductSearchCard.css \
                  frontend/src/features/hotels/pages/HotelSearchPage.js \
                  frontend/src/features/cars/pages/CarRentalsHomePage.css \
                  frontend/scripts/verify-responsive-travel-redundancy.js \
                  .github/workflows/tmp-mobile-product-polish.yml
          git commit -m "Polish mobile travel product layouts"
          git push origin HEAD:fix/mobile-product-polish
