name: Payment Split Architecture Hotfix

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-payment-split-merchants.py
      - .github/workflows/payment-split-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: payment-split-hotfix-main
  cancel-in-progress: false

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply architecture patch
        run: python3 scripts/patch-payment-split-merchants.py

      - name: Backend syntax checks
        run: |
          node --check backend/src/modules/admin/admin-booking-read.repository.mjs
          node --check backend/src/modules/bookings/booking-current-view.mjs
          node --check backend/src/modules/bookings/booking.repository.mjs

      - name: Architecture contract test
        run: node backend/tests/payment_split_merchant_architecture.test.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build

      - name: Commit patched implementation
        run: |
          git config user.name "FareTransit Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/features/admin/components/AdminBookingManagementPanel.js \
                  frontend/src/features/admin/components/AdminBookingManagementPanel.css \
                  backend/src/modules/admin/admin-booking-read.repository.mjs \
                  backend/src/modules/bookings/booking-current-view.mjs \
                  backend/src/modules/bookings/booking.repository.mjs \
                  backend/migrations/128_structured_payment_split_merchants.sql \
                  backend/tests/payment_split_merchant_architecture.test.mjs
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "Implement airline-aware payment split architecture"
          git push origin main
