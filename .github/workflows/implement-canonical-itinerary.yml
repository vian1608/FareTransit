name: Implement canonical itinerary architecture

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/implement-canonical-itinerary.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply architecture patch
        run: python .github/scripts/implement_canonical_itinerary.py

      - name: Store airline logos
        run: bash .github/scripts/store_airline_logos.sh

      - name: Check backend syntax
        run: |
          node --check backend/src/modules/admin/admin.repair.controller.mjs
          node --check backend/src/modules/bookings/booking.repository.mjs
          node --check backend/src/shared/utils/airline-lookup.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Verify implementation
        run: |
          grep -q "DISCONNECTED_ITINERARY_JOURNEY" backend/src/modules/admin/admin.repair.controller.mjs
          grep -q "journey_index" backend/src/modules/bookings/booking.repository.mjs
          grep -q "groupSegmentsIntoJourneys" frontend/src/features/admin/components/AdminBookingWorkspace.js
          grep -q "itineraryType: type" frontend/src/features/admin/components/AdminBookingManagementPanel.js
          grep -q "Trip #{idx + 1}" frontend/src/shared/components/admin/AdminItineraryImportModal.js
          test -f frontend/public/assets/airlines/at.png
          test -f frontend/public/assets/airlines/aa.png
          test -f frontend/public/assets/airlines/qr.png

      - name: Commit implementation
        run: |
          git config user.name "FareTransit Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/implement-canonical-itinerary.yml
          git rm .github/scripts/implement_canonical_itinerary.py
          git rm .github/scripts/store_airline_logos.sh
          git add frontend/src/shared/utils/gdsItineraryHelper.js \
                  frontend/src/shared/components/admin/AdminItineraryImportModal.js \
                  frontend/src/features/admin/components/AdminBookingManagementPanel.js \
                  frontend/src/features/admin/components/AdminBookingWorkspace.js \
                  frontend/src/features/admin/components/AdminBookingWorkspace.css \
                  backend/src/modules/admin/admin.repair.controller.mjs \
                  backend/src/modules/bookings/booking.repository.mjs \
                  backend/src/shared/utils/airline-lookup.mjs \
                  frontend/public/assets/airlines
          git commit -m "Implement canonical trip and journey itinerary model"
          git push origin HEAD:main
