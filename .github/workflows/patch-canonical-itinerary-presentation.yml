name: Patch canonical itinerary presentation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-canonical-itinerary-presentation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply presentation patch
        run: python .github/scripts/patch_canonical_itinerary_presentation.py
      - name: Verify syntax
        run: node --check backend/src/shared/utils/airline-lookup.mjs
      - name: Verify canonical trip model markers
        run: |
          grep -q "const itinerary = { tripType, journeys, outbound, return: returnSegments }" backend/src/shared/utils/airline-lookup.mjs
          grep -q "label: `Trip ${journeyIndex}`" backend/src/shared/utils/airline-lookup.mjs
          grep -q "canonicalType === 'MULTI_CITY'" backend/src/shared/utils/airline-lookup.mjs
          grep -q "journeys.map(journey => renderItineraryGroupHtml" backend/src/shared/utils/airline-lookup.mjs
      - name: Commit
        run: |
          git config user.name "FareTransit Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-canonical-itinerary-presentation.yml
          git rm .github/scripts/patch_canonical_itinerary_presentation.py
          git add backend/src/shared/utils/airline-lookup.mjs
          git commit -m "Use canonical journeys across itinerary presentation"
          git push origin HEAD:main
