name: Fix admin authorization preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-admin-auth-preview.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Patch authorization preview and admin error UX
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              source = p.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(source.replace(old, new, 1))

          def replace_span(path, start, end, replacement):
              p = Path(path)
              source = p.read_text()
              start_count = source.count(start)
              if start_count != 1:
                  raise SystemExit(f"{path}: expected one start marker, found {start_count}")
              i = source.index(start)
              j = source.index(end, i)
              p.write_text(source[:i] + replacement + source[j:])

          replace_once(
              'backend/src/modules/admin/admin.controller.mjs',
              "          rendered = await emailRendererService.renderAuthorizationEmail(booking);",
              "          rendered = await emailRendererService.renderAuthorizationEmail(booking, { previewOnly: true });"
          )

          renderer_lines = [
              "    // Previewing an authorization email must be read-only. Creating a real",
              "    // passenger authorization token writes several DB records and can make the",
              "    // admin preview endpoint slow enough to hit the browser timeout.",
              "    const previewOnly = authContext.previewOnly === true;",
              "    let splits = authContext.splits || booking.payment_splits || booking.paymentSplits || [];",
              "    if ((!splits || splits.length === 0) && !previewOnly) {",
              "      splits = await bookingRepository.getPaymentSplits(booking.id).catch(() => []);",
              "    }",
              "    if (!splits || splits.length === 0) {",
              "      splits = [{ merchant_name: 'FareTransit', amount: authorizedAmount, currency }];",
              "    }",
              "",
              "    let token = authContext.token || booking.authorization_token || booking.authorizationToken || null;",
              "    let expiresAt = authContext.expiresAt || booking.authorization_expires_at || booking.authorizationExpiresAt || null;",
              "    if (token && expiresAt) {",
              "      const expiryMs = new Date(expiresAt).getTime();",
              "      if (!Number.isFinite(expiryMs) || expiryMs <= Date.now()) {",
              "        token = null;",
              "        expiresAt = null;",
              "      }",
              "    }",
              "    if (!token && booking.id && !previewOnly) {",
              "      const authResult = await passengerAuthorizationService.createAuthorizationToken(booking).catch(() => null);",
              "      if (authResult?.token) {",
              "        token = authResult.token;",
              "        expiresAt = authResult.expiresAt || authResult.expires_at || new Date(Date.now() + 24 * 3600 * 1000).toISOString();",
              "      }",
              "    }",
              "    const authUrl = token",
              "      ? `https://www.faretransit.com/authorize/${token}`",
              "      : (previewOnly",
              "          ? 'https://www.faretransit.com/authorize/SECURE-LINK-GENERATED-ON-SEND'",
              "          : 'https://www.faretransit.com/authorize/pending');",
              "",
          ]
          replace_span(
              'backend/src/modules/emails/email-renderer.service.mjs',
              '    let splits = authContext.splits || [];',
              '    const splitsHtml = `',
              '\n'.join(renderer_lines)
          )

          replace_once(
              'backend/src/modules/emails/email-renderer.service.mjs',
              "      authorizationExpiresAt: expiresAt || new Date(Date.now() + 24 * 3600 * 1000).toISOString(),\n      authorizationUrl: authUrl",
              "      authorizationExpiresAt: token ? (expiresAt || new Date(Date.now() + 24 * 3600 * 1000).toISOString()) : null,\n      authorizationUrl: token ? authUrl : null,\n      previewOnly"
          )

          replace_once('frontend/src/shared/api/api.js', '  preview: 15000,', '  preview: 30000,')
          replace_once(
              'frontend/src/shared/components/admin/AdminEmailPreviewModal.js',
              '    const timeoutId = window.setTimeout(() => controller.abort(), 15000);',
              '    const timeoutId = window.setTimeout(() => controller.abort(), 30000);'
          )

          note_marker = "              {/* Authorization Special Links */}\n              {emailType === 'authorization' && previewData.authorizationUrl && ("
          note_lines = [
              "              {/* Authorization preview is intentionally read-only until Send creates the secure token. */}",
              "              {emailType === 'authorization' && previewData.previewOnly && !previewData.authorizationUrl && (",
              "                <div style={{ backgroundColor: '#eff6ff', border: '1px solid #bfdbfe', borderRadius: '8px', padding: '12px 16px', marginBottom: '16px', fontSize: '13px', color: '#1e40af' }}>",
              "                  <div style={{ fontWeight: 800, marginBottom: '4px' }}>🔐 Secure link generated on send</div>",
              "                  <div>This preview does not create or persist a passenger authorization token. The one-time secure authorization link is generated when you click Send.</div>",
              "                </div>",
              "              )}",
              "",
              "              {/* Authorization Special Links */}",
              "              {emailType === 'authorization' && previewData.authorizationUrl && (",
          ]
          replace_once(
              'frontend/src/shared/components/admin/AdminEmailPreviewModal.js',
              note_marker,
              '\n'.join(note_lines)
          )

          dashboard_marker = "  }, [isBookingDetailRoute]);\n\n  useEffect(() => {\n    if (isBookingDetailRoute) return undefined;\n    let frame = 0;"
          dashboard_lines = [
              "  }, [isBookingDetailRoute]);",
              "",
              "  // Keep admin failures noticeable but temporary: move the page to the top so",
              "  // the alert is in context, then clear it automatically to keep the workspace clean.",
              "  useEffect(() => {",
              "    if (!globalFailure) return undefined;",
              "",
              "    const frame = window.requestAnimationFrame(() => {",
              "      window.scrollTo({ top: 0, behavior: 'smooth' });",
              "    });",
              "    const autoDismiss = window.setTimeout(() => {",
              "      setGlobalFailure(null);",
              "    }, 6500);",
              "",
              "    return () => {",
              "      window.cancelAnimationFrame(frame);",
              "      window.clearTimeout(autoDismiss);",
              "    };",
              "  }, [globalFailure]);",
              "",
              "  useEffect(() => {",
              "    if (isBookingDetailRoute) return undefined;",
              "    let frame = 0;",
          ]
          replace_once(
              'frontend/src/features/admin/pages/AdminDashboardPage.js',
              dashboard_marker,
              '\n'.join(dashboard_lines)
          )

          checks = {
              'backend/src/modules/admin/admin.controller.mjs': ["previewOnly: true"],
              'backend/src/modules/emails/email-renderer.service.mjs': ["const previewOnly = authContext.previewOnly === true;", "SECURE-LINK-GENERATED-ON-SEND", "authorizationUrl: token ? authUrl : null"],
              'frontend/src/shared/api/api.js': ["preview: 30000"],
              'frontend/src/shared/components/admin/AdminEmailPreviewModal.js': ["controller.abort(), 30000", "Secure link generated on send"],
              'frontend/src/features/admin/pages/AdminDashboardPage.js': ["window.scrollTo({ top: 0, behavior: 'smooth' });", "}, 6500);"]
          }
          for path, needles in checks.items():
              text = Path(path).read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"{path}: verification failed for {needle}")

      - name: Check backend syntax
        run: |
          node --check backend/src/modules/admin/admin.controller.mjs
          node --check backend/src/modules/emails/email-renderer.service.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build

      - name: Commit verified fix and remove one-off workflow
        run: |
          git config user.name "FareTransit Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-admin-auth-preview.yml
          git add backend/src/modules/admin/admin.controller.mjs \
                  backend/src/modules/emails/email-renderer.service.mjs \
                  frontend/src/shared/api/api.js \
                  frontend/src/shared/components/admin/AdminEmailPreviewModal.js \
                  frontend/src/features/admin/pages/AdminDashboardPage.js
          git commit -m "Fix authorization preview and admin error UX"
          git push origin HEAD:main
