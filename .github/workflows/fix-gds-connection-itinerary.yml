name: Apply GDS itinerary repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-gds-connection-itinerary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/fix_gds_connection_itinerary.py

      - name: Check backend syntax
        run: |
          node --check backend/src/modules/bookings/booking.repository.mjs
          node --check backend/src/modules/admin/admin.repair.controller.mjs
          node --check backend/src/shared/utils/airline-lookup.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "FareTransit Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-gds-connection-itinerary.yml .github/scripts/fix_gds_connection_itinerary.py
          git add backend/src/modules/bookings/booking.repository.mjs backend/src/modules/admin/admin.repair.controller.mjs backend/src/shared/utils/airline-lookup.mjs frontend/src/shared/components/admin/AdminItineraryImportModal.js frontend/src/shared/utils/gdsItineraryHelper.js
          git commit -m "Fix multi-segment GDS itinerary persistence"
          git push origin HEAD:main
