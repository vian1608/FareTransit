name: Authorization Runtime Integrity Repair

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-authorization-runtime-integrity.py
      - .github/workflows/authorization-runtime-integrity.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: authorization-runtime-integrity-main
  cancel-in-progress: false

jobs:
  repair-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply runtime integrity repair
        run: python3 scripts/patch-authorization-runtime-integrity.py

      - name: Syntax checks
        run: |
          node --check backend/src/modules/bookings/booking.repository.egress-hardening.mjs
          node --check backend/src/modules/authorizations/passenger-authorization.service.mjs
          node --check backend/src/modules/authorizations/passenger-authorization.controller.mjs

      - name: Authorization runtime integrity tests
        run: |
          node backend/tests/authorization_runtime_integrity.test.mjs
          node backend/tests/authorization_integrity_v2.test.mjs
          node backend/tests/supabase_egress_hardening_contract.test.mjs

      - name: Commit implementation
        run: |
          git config user.name "FareTransit Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/modules/bookings/booking.repository.egress-hardening.mjs \
                  backend/src/modules/authorizations/passenger-authorization.service.mjs \
                  backend/src/modules/authorizations/passenger-authorization.controller.mjs \
                  backend/tests/supabase_egress_hardening_contract.test.mjs \
                  backend/tests/authorization_runtime_integrity.test.mjs
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "Fail closed on stale authorization revisions"
          git push origin main
