name: Fix reservation email delivery status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-email-delivery-status.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch backend DTO and confirmation UI
        shell: bash
        env:
          OLD_BACKEND_B64: 
          NEW_BACKEND_B64: 
          OLD_FRONTEND_B64: 
          NEW_FRONTEND_B64: 
        run: |
          python -c "import os,base64; from pathlib import Path; bp=Path('backend/src/modules/bookings/booking.controller.mjs'); fp=Path('frontend/src/features/bookings/pages/PaymentSuccessPage.js'); b=bp.read_text(); f=fp.read_text(); ob=base64.b64decode(os.environ['OLD_BACKEND_B64']).decode(); nb=base64.b64decode(os.environ['NEW_BACKEND_B64']).decode(); of=base64.b64decode(os.environ['OLD_FRONTEND_B64']).decode(); nf=base64.b64decode(os.environ['NEW_FRONTEND_B64']).decode(); assert b.count(ob)==1, f'backend block count={b.count(ob)}'; assert f.count(of)==1, f'frontend block count={f.count(of)}'; bp.write_text(b.replace(ob,nb,1)); fp.write_text(f.replace(of,nf,1))"

      - name: Check backend syntax
        run: node --check backend/src/modules/bookings/booking.controller.mjs

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: |
          npm ci
          npm run build

      - name: Commit verified fix and remove one-off workflow
        shell: bash
        run: |
          git config user.name "FareTransit Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-email-delivery-status.yml
          git add backend/src/modules/bookings/booking.controller.mjs frontend/src/features/bookings/pages/PaymentSuccessPage.js
          git commit -m "Fix reservation email delivery status"
          git push origin HEAD:main
