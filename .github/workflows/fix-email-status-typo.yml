name: Repair reservation email status typo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-email-status-typo.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair typo and verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'booingRequestEmailStatus' backend/src/modules/bookings/booking.controller.mjs | wc -l)" -eq 1
          sed -i 's/booingRequestEmailStatus/bookingRequestEmailStatus/g' backend/src/modules/bookings/booking.controller.mjs
          test "$(grep -o 'booingRequestEmailStatus' backend/src/modules/bookings/booking.controller.mjs | wc -l)" -eq 0
          test "$(grep -o 'bookingRequestEmailStatus' backend/src/modules/bookings/booking.controller.mjs | wc -l)" -ge 3
          node --check backend/src/modules/bookings/booking.controller.mjs

      - name: Commit repaired code and remove workflow
        shell: bash
        run: |
          git config user.name "FareTransit Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-email-status-typo.yml
          git add backend/src/modules/bookings/booking.controller.mjs
          git commit -m "Repair reservation email status variable"
          git push origin HEAD:main
