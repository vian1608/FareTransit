name: FareTransit Hardening CI

on:
  push:
    branches:
      - faretransit-hardening-phase2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-regression:
    name: Backend regression suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SECRET_KEY: placeholder-key
      JWT_SECRET: faretransit-ci-jwt-secret-not-for-production
      ADMIN_PASSWORD: faretransit-ci-admin-password-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Run production-readiness regression suite
        run: npm run verify:production-ready

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
