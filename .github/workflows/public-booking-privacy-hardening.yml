name: Public Booking Privacy Hardening

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-public-booking-privacy.py
      - .github/workflows/public-booking-privacy-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-booking-privacy-main
  cancel-in-progress: false

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply privacy hardening
        run: python3 scripts/patch-public-booking-privacy.py

      - name: Backend syntax checks
        run: |
          node --check backend/src/modules/bookings/booking-public-reservation.controller.mjs
          node --check backend/src/modules/bookings/booking-current-search.controller.mjs
          node --check backend/src/modules/bookings/booking.controller.mjs
          node --check backend/src/modules/bookings/booking.routes.mjs

      - name: Privacy and authorization contracts
        run: |
          node backend/tests/public_booking_privacy_contract.test.mjs
          node backend/tests/authorization_runtime_integrity.test.mjs
          node backend/tests/authorization_integrity_v2.test.mjs
          node backend/tests/supabase_egress_hardening_contract.test.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "FareTransit Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/modules/bookings/booking-public-reservation.controller.mjs \
                  backend/src/modules/bookings/booking-current-search.controller.mjs \
                  backend/src/modules/bookings/booking.controller.mjs \
                  backend/src/modules/bookings/booking.routes.mjs \
                  frontend/src/features/bookings/pages/MyBookingsPage.js \
                  backend/tests/public_booking_privacy_contract.test.mjs
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "Harden public booking privacy boundaries"
          git push origin main
