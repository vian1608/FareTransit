name: Finish authorization preview flag

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-auth-preview-flag.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch preview flag
        shell: python
        run: |
          from pathlib import Path
          path = Path('backend/src/modules/admin/admin.controller.mjs')
          source = path.read_text()
          old = "        missingFields: rendered.missingFields || [],\n        authorizationUrl: rendered.authorizationUrl || null,"
          new = "        missingFields: rendered.missingFields || [],\n        previewOnly: rendered.previewOnly === true,\n        authorizationUrl: rendered.authorizationUrl || null,"
          if source.count(old) != 1:
              raise SystemExit(f'Expected preview payload marker once, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))

      - name: Verify backend syntax and frontend contract
        run: |
          node --check backend/src/modules/admin/admin.controller.mjs
          grep -q "previewOnly: rendered.previewOnly === true" backend/src/modules/admin/admin.controller.mjs
          grep -q "previewData.previewOnly" frontend/src/shared/components/admin/AdminEmailPreviewModal.js
          grep -q "window.scrollTo({ top: 0, behavior: 'smooth' });" frontend/src/features/admin/pages/AdminDashboardPage.js

      - name: Commit final preview fix and remove workflow
        run: |
          git config user.name "FareTransit Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-auth-preview-flag.yml
          git add backend/src/modules/admin/admin.controller.mjs
          git commit -m "Expose authorization preview-only state"
          git push origin HEAD:main
