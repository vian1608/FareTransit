name: Fix authorization email payment split guard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-auth-email-payment-split-guard.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/fix_auth_email_payment_split_guard.py

      - name: Check backend syntax
        run: node --check backend/src/modules/admin/admin.controller.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build

      - name: Commit verified fix
        run: |
          git config user.name "FareTransit Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-auth-email-payment-split-guard.yml .github/scripts/fix_auth_email_payment_split_guard.py
          git add backend/src/modules/admin/admin.controller.mjs frontend/src/features/admin/components/AdminBookingManagementPanel.js
          git commit -m "Guide authorization email payment split setup"
          git push origin HEAD:main
