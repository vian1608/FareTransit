name: FareTransit Production Parity Sync

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: Production parity and safety gate
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SECRET_KEY: placeholder-key
      JWT_SECRET: faretransit-ci-jwt-secret-not-for-production
      ADMIN_PASSWORD: faretransit-ci-admin-password-not-for-production
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verify FareTransit identity and critical modules
        shell: bash
        run: |
          set -euo pipefail
          test -d backend/src/modules/bookings
          test -d backend/src/modules/admin
          test -d backend/src/modules/backoffice
          test -d backend/src/modules/secure-payments
          test -d backend/src/modules/cars
          test -d backend/src/modules/hotels
          test -f frontend/src/features/secure-payments/VgsCheckoutCardFields.js
          test -f frontend/src/shared/constants/supportContact.js
          grep -R -q 'faretransit.com' frontend/src backend/src api --exclude-dir=node_modules
          if grep -R -n -E 'support@thefinalseat\.com|www\.thefinalseat\.com' frontend/src backend/src api --exclude-dir=node_modules; then
            echo 'Final Seat production identity remains in active FareTransit application files.' >&2
            exit 1
          fi

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run production-readiness regression suite
        working-directory: backend
        run: npm run verify:production-ready

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build

      - name: Check backend module syntax
        shell: bash
        run: find backend/src -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Import backend in production-style preview mode
        shell: bash
        env:
          VERCEL_ENV: preview
          NODE_ENV: production
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SECRET_KEY: placeholder-key
          JWT_SECRET: faretransit-ci-jwt-secret-not-for-production
          ADMIN_PASSWORD: faretransit-ci-admin-password-not-for-production
        run: node -e "import('./backend/src/app.mjs').then(() => console.log('backend import ok'))"
