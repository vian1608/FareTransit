name: Temporary FareTransit Phone Rewrite

on:
  push:
    branches: [hotfix/faretransit-phone-888-780-8855]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/faretransit-phone-888-780-8855
          fetch-depth: 0
      - name: Apply targeted phone rewrites
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          old_display, new_display = '+1 (213) 965-9727', '+1 (888) 780-8855'
          old_schema, new_schema = '+1-213-965-9727', '+1-888-780-8855'
          old_tel, new_tel = 'tel:+12139659727', 'tel:+18887808855'
          old_e164, new_e164 = '+12139659727', '+18887808855'
          def read(p): return (root / p).read_text()
          def write(p, s): (root / p).write_text(s)

          p='backend/src/integrations/resend/templates/booking-confirmation.html'; s=read(p)
          old='support@faretransit.com &nbsp;·&nbsp; +1 (213) 965-9727<br>'
          new='support@faretransit.com &nbsp;·&nbsp; <a href="tel:+18887808855" style="color:#d9e3ef;text-decoration:none;">+1 (888) 780-8855</a><br>'
          assert s.count(old)==1; write(p,s.replace(old,new))

          p='backend/src/modules/emails/email-renderer.service.mjs'; s=read(p)
          anchor="import Handlebars from 'handlebars';\n"; envimp="import env from '../../config/env.mjs';\n"
          assert anchor in s
          if envimp not in s: s=s.replace(anchor,anchor+envimp,1)
          field="supportPhone: '+1 (213) 965-9727'"; assert s.count(field)==3
          s=s.replace(field,'supportPhone: env.supportPhoneDisplay')
          assert s.count(old_display)==6, s.count(old_display)
          s=s.replace(old_display,'${env.supportPhoneDisplay}'); write(p,s)

          p='frontend/src/features/flights/pages/SeniorTravelPage.js'; s=read(p)
          assert 'SUPPORT_PHONE_DISPLAY,\n  SUPPORT_PHONE_HREF,' in s
          if 'SUPPORT_PHONE_SCHEMA,' not in s: s=s.replace('SUPPORT_PHONE_DISPLAY,\n  SUPPORT_PHONE_HREF,','SUPPORT_PHONE_DISPLAY,\n  SUPPORT_PHONE_HREF,\n  SUPPORT_PHONE_SCHEMA,',1)
          assert s.count("telephone: '+12139659727'")==1 and s.count("telephone: '+1-213-965-9727'")==1
          s=s.replace("telephone: '+12139659727'",'telephone: SUPPORT_PHONE_SCHEMA').replace("telephone: '+1-213-965-9727'",'telephone: SUPPORT_PHONE_SCHEMA'); write(p,s)

          p='frontend/src/features/flights/pages/AirlineRoute.js'; s=read(p)
          anchor="import { trackLeadConversion } from '../../../shared/utils/analytics';\n"; shared="import { SUPPORT_PHONE_DISPLAY, SUPPORT_PHONE_HREF } from '../../../shared/constants/supportContact';\n"
          assert anchor in s
          if shared not in s: s=s.replace(anchor,anchor+shared,1)
          assert s.count('href={`tel:${airline.phone}`}')==1 and s.count('{airline.phone}')==2
          s=s.replace('href={`tel:${airline.phone}`}','href={SUPPORT_PHONE_HREF}').replace('{airline.phone}','{SUPPORT_PHONE_DISPLAY}'); write(p,s)

          p='frontend/src/shared/data/airlinesData.json'; s=read(p)
          s,n=re.subn(r'^\s{4}"phone": "\+1-213-965-9727",\n','',s,flags=re.MULTILINE); assert n==20,n; write(p,s)

          p='backend/tests/official_support_phone_number_update.test.mjs'; s=read(p)
          s=s.replace(old_display,new_display).replace(old_schema,new_schema).replace(old_tel,new_tel).replace(old_e164,new_e164)
          s=s.replace("assert.ok(emailHtml.includes('Call +1 (888) 780-8855'), 'HTML email template must display Call +1 (888) 780-8855');","assert.ok(emailHtml.includes('+1 (888) 780-8855'), 'HTML email template must display the approved support number');")
          old="  for (const relPath of prodFilesToScan) {\n    const content = await fs.readFile(path.join(ROOT_DIR, relPath), 'utf8');\n    assert.ok(!content.includes('213-965-9727'), `File ${relPath} must not contain 213-965-9727`);\n    assert.ok(!content.includes('2139659727'), `File ${relPath} must not contain 2139659727`);\n  }"
          new="  const legacyHyphenated = ['213', '965', '9727'].join('-');\n  const legacyCompact = ['213', '965', '9727'].join('');\n  for (const relPath of prodFilesToScan) {\n    const content = await fs.readFile(path.join(ROOT_DIR, relPath), 'utf8');\n    assert.ok(!content.includes(legacyHyphenated), `File ${relPath} must not contain the legacy hyphenated support number`);\n    assert.ok(!content.includes(legacyCompact), `File ${relPath} must not contain the legacy compact support number`);\n  }"
          assert old in s; write(p,s.replace(old,new))

          p='backend/tests/seo_metadata_branding_cleanliness.test.mjs'; s=read(p); assert old_schema in s; write(p,s.replace(old_schema,new_schema))
          PY
      - name: Commit targeted rewrites
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/integrations/resend/templates/booking-confirmation.html backend/src/modules/emails/email-renderer.service.mjs backend/tests/official_support_phone_number_update.test.mjs backend/tests/seo_metadata_branding_cleanliness.test.mjs frontend/src/features/flights/pages/SeniorTravelPage.js frontend/src/features/flights/pages/AirlineRoute.js frontend/src/shared/data/airlinesData.json
          git diff --cached --quiet && exit 0
          git commit -m "Update remaining FareTransit business phone references"
          git push origin HEAD:hotfix/faretransit-phone-888-780-8855
