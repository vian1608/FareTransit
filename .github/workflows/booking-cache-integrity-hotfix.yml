name: Booking Cache Integrity Hotfix

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-booking-cache-precedence.py
      - .github/workflows/booking-cache-integrity-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: booking-cache-integrity-main
  cancel-in-progress: false

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cache integrity patch
        run: python3 scripts/patch-booking-cache-precedence.py
      - name: Backend syntax check
        run: node --check backend/src/modules/bookings/booking.repository.mjs
      - name: Verify DB-over-cache invariant
        run: |
          grep -q "data.*memOverridden" backend/src/modules/bookings/booking.repository.mjs || true
          node -e "const fs=require('fs'); const s=fs.readFileSync('backend/src/modules/bookings/booking.repository.mjs','utf8'); if(!s.includes('? { ...(memOverridden || {}), ...data }')) process.exit(1);"
      - name: Commit implementation
        run: |
          git config user.name "FareTransit Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/modules/bookings/booking.repository.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make database authoritative over booking cache"
          git push origin main
