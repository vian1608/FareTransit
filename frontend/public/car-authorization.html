<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Car Rental Authorization | FareTransit</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font:15px/1.5 Arial,sans-serif}.wrap{max-width:960px;margin:34px auto;padding:0 16px}.card{background:#fff;border:1px solid #dfe6f0;border-radius:16px;box-shadow:0 12px 34px rgba(20,45,80,.08);overflow:hidden}.head{background:#102d54;color:#fff;padding:24px 28px;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-size:27px;font-weight:900}.brand span{color:#55a7ff}.body{padding:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.sec{border:1px solid #e2e8f0;border-radius:12px;padding:18px;margin-bottom:16px}.sec h3{margin:0 0 12px;color:#102d54}.row{display:flex;justify-content:space-between;gap:18px;padding:7px 0;border-bottom:1px solid #f0f3f7}.row:last-child{border-bottom:0}.muted{color:#667085}.logo{max-width:160px;max-height:58px;object-fit:contain}.snaps{display:flex;gap:10px;flex-wrap:wrap}.snaps img{width:150px;height:100px;object-fit:cover;border-radius:9px;border:1px solid #e2e8f0}.tx{padding:14px;border-radius:10px;background:#f7f9fc;margin:10px 0}.total{font-size:21px;font-weight:900}.terms{white-space:pre-wrap;font-size:14px}.ack{background:#eef5ff;border:1px solid #bcd4f7;border-radius:12px;padding:16px;font-weight:650;line-height:1.65;margin:20px 0}.btn{width:100%;border:0;border-radius:10px;background:#1367d8;color:#fff;padding:16px;font-size:16px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.error{background:#fff1f2;color:#991b1b;border:1px solid #fecdd3;padding:14px;border-radius:10px}.success{text-align:center;padding:50px 20px}.success h2{color:#166534}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.body{padding:18px}.row{flex-direction:column;gap:2px}}</style></head><body><div class="wrap"><div class="card"><div class="head"><div><div class="brand">Fare<span>Transit</span></div><div>Car Rental Authorization</div></div><div id="ref"></div></div><div class="body" id="app">Loading secure authorization…</div></div></div><script>const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=(v,c='USD')=>{try{return new Intl.NumberFormat('en-US',{style:'currency',currency:c}).format(Number(v||0))}catch{return '$'+Number(v||0).toFixed(2)}};const token=new URLSearchParams(location.search).get('token');let data=null;async function load(){if(!token){$('#app').innerHTML='<div class="error">Authorization token is missing.</div>';return}try{const r=await fetch('/api/reservation-authorizations/'+encodeURIComponent(token),{cache:'no-store'});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.error?.message||'Unable to load authorization.');data=j.data;render()}catch(e){$('#app').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}function render(){const a=data.authorization,r=data.reservation,s=a.service_snapshot||{},car=s.car||{},sn=s.snapshots||[],cust=a.customer_snapshot||{},bill=a.billing_snapshot||{},tx=a.transactions||[],custom=(a.custom_sections||[]).filter(x=>x.visibility!=='ADMIN_ONLY');$('#ref').innerHTML='Booking ID: <strong>'+esc(r.booking_reference)+'</strong><br><span style="opacity:.8">Authorization v'+esc(a.version)+'</span>';let html='<div class="grid"><div><div class="sec"><h3>Rental Provider</h3>'+(car.rental_company_logo_url?'<img class="logo" src="'+esc(car.rental_company_logo_url)+'" alt="'+esc(car.rental_company_name)+' logo">':'')+'<div style="font-size:20px;font-weight:800">'+esc(car.rental_company_name||'Rental company')+'</div></div><div class="sec"><h3>Rental Details</h3><div class="row"><span class="muted">Vehicle</span><strong>'+esc((car.vehicle_name||car.vehicle_category||'')+(car.or_similar?' or similar':''))+'</strong></div><div class="row"><span class="muted">Pickup</span><strong>'+esc(car.pickup_location||'')+'<br>'+esc(car.pickup_at?new Date(car.pickup_at).toLocaleString():'')+'</strong></div><div class="row"><span class="muted">Drop-off</span><strong>'+esc(car.dropoff_location||'')+'<br>'+esc(car.dropoff_at?new Date(car.dropoff_at).toLocaleString():'')+'</strong></div>'+(car.mileage_policy?'<div class="row"><span class="muted">Mileage</span><span>'+esc(car.mileage_policy)+'</span></div>':'')+(car.fuel_policy?'<div class="row"><span class="muted">Fuel</span><span>'+esc(car.fuel_policy)+'</span></div>':'')+(car.deposit_terms?'<div class="row"><span class="muted">Deposit / Hold</span><span>'+esc(car.deposit_terms)+'</span></div>':'')+'</div></div><div><div class="sec"><h3>Renter / Driver</h3><div><strong>'+esc(cust.fullName||'')+'</strong></div><div>DOB: '+esc(cust.dateOfBirth||'')+'</div><div>'+esc(cust.email||'')+'</div><div>'+esc(cust.phone||'')+'</div></div><div class="sec"><h3>Billing Details</h3><div>'+esc(bill.cardholder_name||'')+'</div><div>'+esc(bill.address_line_1||'')+' '+esc(bill.address_line_2||'')+'</div><div>'+esc([bill.city,bill.state_province,bill.postal_code].filter(Boolean).join(', '))+'</div><div>'+esc(bill.country||'')+'</div><div style="margin-top:8px"><strong>'+esc(bill.card_brand||'Card')+' ending '+esc(bill.card_last4||'----')+'</strong></div></div></div></div>';if(sn.length)html+='<div class="sec"><h3>Vehicle Reference</h3><div class="snaps">'+sn.map(x=>'<img src="'+esc(x.image_url)+'" alt="Vehicle reference">').join('')+'</div><div class="muted" style="margin-top:8px">Vehicle imagery is for reference; make/model may be substituted when marked “or similar.”</div></div>';html+='<div class="sec"><h3>Payment Authorization</h3><div class="row total"><span>Total Amount Authorized</span><span>'+esc(money(a.total_amount,a.currency))+'</span></div>'+tx.map((x,i)=>'<div class="tx"><strong>Transaction '+(i+1)+'</strong><div class="row"><span>Amount</span><strong>'+esc(money(x.amount,x.currency))+'</strong></div><div class="row"><span>Merchant Name</span><strong>'+esc(x.merchant_name)+'</strong></div><div class="row"><span>Collection</span><strong>'+esc(x.collection_method==='PAY_AT_COUNTER'?'Pay at Counter':'Pay Now')+'</strong></div>'+(x.description?'<div class="row"><span>Description</span><span>'+esc(x.description)+'</span></div>':'')+'</div>').join('')+'</div>';custom.forEach(x=>{html+='<div class="sec"><h3>'+esc(x.title||'Additional Information')+'</h3><div style="white-space:pre-wrap">'+esc(x.content||'')+'</div></div>'});html+='<div class="sec"><h3>Terms &amp; Conditions</h3><div class="terms">'+esc(a.terms_snapshot?.text||'')+'</div></div><div class="ack">'+esc(a.final_acknowledgement||'')+'</div><button class="btn" id="authorize">I AUTHORIZE TO PAY</button>';$('#app').innerHTML=html;$('#authorize').onclick=authorize}async function authorize(){const b=$('#authorize');b.disabled=true;b.textContent='Authorizing…';try{const r=await fetch('/api/reservation-authorizations/'+encodeURIComponent(token)+'/authorize',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.error?.message||'Authorization failed.');$('#app').innerHTML='<div class="success"><h2>Authorization received</h2><p>Thank you. FareTransit has received your authorization for booking <strong>'+esc(data.reservation.booking_reference)+'</strong>.</p><p class="muted">Our team can now proceed with the rental reservation.</p></div>'}catch(e){b.disabled=false;b.textContent='I AUTHORIZE TO PAY';alert(e.message)}}load();</script></body></html>
