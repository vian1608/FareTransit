  <path d="M0 570 C250 500 525 505 960 590 L960 760 0 760Z" fill="url(#road)"/>
  <path d="M72 654 C330 589 595 596 930 650" fill="none" stroke="#f5eadf" stroke-width="10" stroke-linecap="round" stroke-dasharray="54 38" opacity="0.88"/>

