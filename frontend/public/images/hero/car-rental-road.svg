<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">Scenic car rental road illustration</title>
  <desc id="desc">A neutral white SUV beside a scenic road with mountains and a traveler silhouette.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f2f8"/>
      <stop offset="0.56" stop-color="#f6e8e6"/>
      <stop offset="1" stop-color="#f8efe8"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d7b6d"/>
      <stop offset="1" stop-color="#30483d"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6c4b6"/>
      <stop offset="1" stop-color="#9b8576"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfb"/>
      <stop offset="1" stop-color="#d9dde0"/>
    </linearGradient>
    <linearGradient id="burgundy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a61646"/>
      <stop offset="1" stop-color="#71102e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#28151c" flood-opacity="0.22"/>
    </filter>
  </defs>

